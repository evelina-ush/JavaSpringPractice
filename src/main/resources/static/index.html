<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление товарами и поставками</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --text: #2c3e50;
            --light: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .tabs {
            display: flex;
            background: #f1f3f5;
        }

        .tab {
            padding: 18px 40px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text);
            border-bottom: 4px solid transparent;
        }

        .tab.active {
            background: white;
            border-bottom: 4px solid var(--primary);
            color: var(--primary);
        }

        .content { padding: 30px; display: none; }
        .content.active { display: block; }

        h1 { font-size: 28px; margin-bottom: 20px; color: var(--text); }

        .loading {
            text-align: center;
            padding: 80px 20px;
            font-size: 18px;
            color: #999;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f1f3f5;
            font-weight: 600;
        }

        .price { font-weight: bold; color: #e67e22; }
        .edit-input {
            width: 130px;
            padding: 8px;
            border: 2px solid #3498db;
            border-radius: 6px;
            font-size: 16px;
        }

        .btn-save {
            padding: 8px 16px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-save:hover {
            background: #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" data-tab="supplies">📦 Поставки</div>
        <div class="tab" data-tab="products">💰 Управление ценами</div>
    </div>

    <div id="supplies" class="content active">
        <h1>Управление поставками</h1>
        <div id="loading-supplies" class="loading">Загрузка поставок...</div>
        <table id="suppliesTable" style="display: none;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Продукт</th>
                <th>Количество</th>
                <th>Цена за ед.</th>
                <th>Сумма</th>
                <th>Дата договора</th>
                <th>Клиент</th>
                <th>Город</th>
            </tr>
            </thead>
            <tbody id="suppliesBody"></tbody>
        </table>
    </div>

    <div id="products" class="content">
        <h1>Управление ценами товаров</h1>
        <div id="loading-products" class="loading">Загрузка товаров...</div>
        <table id="productsTable" style="display: none;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Название товара</th>
                <th>Текущая цена</th>
                <th>Новая цена</th>
                <th>Действие</th>
            </tr>
            </thead>
            <tbody id="productsBody"></tbody>
        </table>
    </div>
</div>

<script>
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

            tab.classList.add('active');
            document.getElementById(tab.dataset.tab).classList.add('active');
        });
    });

    async function loadSupplies() {
        const loading = document.getElementById('loading-supplies');
        const table = document.getElementById('suppliesTable');
        const tbody = document.getElementById('suppliesBody');

        try {
            const response = await fetch('http://localhost:8080/supply-management/supplies');
            if (!response.ok) throw new Error("Ошибка сервера");

            const result = await response.json();

            if (!result.success || !result.information || result.information.length === 0) {
                loading.innerHTML = '<div class="no-data">Нет данных для отображения</div>';
                return;
            }

            tbody.innerHTML = '';
            result.information.forEach(item => {
                const sum = (item.amountOfProduct * (item.pricePaid || 0)).toFixed(2);
                const row = `
                    <tr>
                        <td><strong>${item.id}</strong></td>
                        <td>${item.productName || '—'}</td>
                        <td>${item.amountOfProduct}</td>
                        <td>${item.pricePaid ? item.pricePaid.toFixed(2) : '—'}</td>
                        <td><strong>${sum} ₽</strong></td>
                        <td>${item.contractDate || '—'}</td>
                        <td>${item.customerName || '—'}</td>
                        <td>${item.customerCity || '—'}</td>
                    </tr>`;
                tbody.innerHTML += row;
            });

            loading.style.display = "none";
            table.style.display = "table";

        } catch (error) {
            loading.innerHTML = `Ошибка: ${error.message}<br><br>Проверьте, запущен ли сервер.`;
        }
    }

    async function loadProducts() {
        const loading = document.getElementById('loading-products');
        const table = document.getElementById('productsTable');
        const tbody = document.getElementById('productsBody');

        try {
            const res = await fetch('http://localhost:8080/product-management/products');
            const data = await res.json();

            if (!data.success) throw new Error(data.message || "Ошибка загрузки");

            tbody.innerHTML = '';

            data.information.forEach(p => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${p.id}</strong></td>
                    <td>${p.name || '—'}</td>
                    <td class="price">${p.price ? p.price.toFixed(2) + ' ₽' : '—'}</td>
                    <td>
                        <input type="number" step="0.01" class="edit-input"
                               value="${p.price ? p.price.toFixed(2) : ''}" id="price-${p.id}">
                    </td>
                    <td>
                        <button class="btn-save" onclick="saveNewPrice(${p.id})">Сохранить</button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            loading.style.display = 'none';
            table.style.display = 'table';

        } catch (err) {
            loading.innerHTML = `Ошибка: ${err.message}`;
        }
    }

    async function saveNewPrice(id) {
        const input = document.getElementById(`price-${id}`);
        const newPrice = parseFloat(input.value);

        if (!newPrice || newPrice <= 0) {
            alert("Введите корректную цену (> 0)");
            return;
        }

        try {
            const res = await fetch(`http://localhost:8080/product-management/products/${id}/price`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newPrice: newPrice })
            });

            const result = await res.json();

            if (result.success) {
                alert("Цена успешно обновлена!");
                loadProducts();
            } else {
                alert((result.message || "Неизвестная ошибка"));
            }
        } catch (e) {
            alert("Ошибка соединения с сервером");
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadSupplies();
        loadProducts();
    });
</script>

</body>
</html>
