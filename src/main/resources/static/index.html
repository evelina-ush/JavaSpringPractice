<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поставки товаров</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --text: #2c3e50;
            --light: #f8f9fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .content {
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 18px;
            color: #dddddd;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: #f1f3f5;
            color: var(--text);
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 14px 12px;
            border-bottom: 1px solid #eee;
            color: #2e2b2b;
        }

        .amount {
            font-weight: 600;
            color: #2980b9;
        }

        .total {
            font-weight: bold;
            color: var(--success);
        }

        .no-data {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
            font-size: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Управление поставками</h1>
    </header>

    <div class="content">
        <div id="loading" class="loading">Загрузка данных...</div>

        <table id="dataTable" style="display: none;">
            <thead>
            <tr>
                <th>ID</th>
                <th>Продукт</th>
                <th>Количество</th>
                <th>Цена за ед.</th>
                <th>Сумма</th>
                <th>Дата договора</th>
                <th>Клиент</th>
                <th>Город</th>
            </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    async function loadDeliveryItems() {
        const loading = document.getElementById('loading');
        const table = document.getElementById('dataTable');
        const tbody = document.getElementById('tableBody');

        try {
            const response = await fetch('http://localhost:8080/supply-management/supplies');

            if (!response.ok) throw new Error("Ошибка сервера");

            const result = await response.json();

            if (!result.success || !result.information || result.information.length === 0) {
                loading.innerHTML = '<div class="no-data">Нет данных для отображения</div>';
                return;
            }

            tbody.innerHTML = '';

            result.information.forEach(item => {
                const sum = (item.amountOfProduct * (item.pricePaid || 0)).toFixed(2);

                const row = `
        <tr>
          <td><strong>${item.id}</strong></td>
          <td>${item.productName || '—'}</td>
          <td class="amount">${item.amountOfProduct}</td>
          <td>${item.pricePaid ? item.pricePaid.toFixed(2) : '—'}</td>
          <td class="total">${sum} ₽</td>
          <td>${item.contractDate || '—'}</td>
          <td>${item.customerName || '—'}</td>
          <td>${item.customerCity || '—'}</td>
        </tr>
      `;
                tbody.innerHTML += row;
            });

            loading.style.display = "none";
            table.style.display = "table";

        } catch (error) {
            loading.innerHTML = `Ошибка: ${error.message}<br><br>Проверьте, запущен ли сервер.`;
            console.error(error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadDeliveryItems);
</script>

</body>
</html>
